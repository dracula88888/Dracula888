name: Build DiamondSwordPlugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: კოდის ჩამოტვირთვა
        uses: actions/checkout@v4

      - name: Java 17-ის დაყენება
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven-ით build
        run: mvn -B package --file pom.xml

      - name: JAR ფაილის შენახვა artifact-ად
        uses: actions/upload-artifact@v4
        with:
          name: DiamondSwordPlugin-jar
          path: target/DiamondSwordPlugin-*.jar
          retention-days: 14
